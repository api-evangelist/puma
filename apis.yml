apis:
- aid: puma:control-app
  name: Puma Control/Status Application
  description: >-
    Puma ships with an optional control/status HTTP application that can be bound to a local port or Unix
    socket and queried for runtime statistics (busy threads, worker status, backlog) and lifecycle control
    (stop, restart, halt). Authentication uses a shared control token passed via the `token` query parameter.
  humanURL: https://github.com/puma/puma/blob/master/docs/restart.md
